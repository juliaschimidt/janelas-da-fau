<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>janelas da FAU · cartaz</title>
<link rel="stylesheet" href="fonts.css">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ddd;font-family:Sans;color:#141414}
.a4{width:210mm;height:297mm;margin:10mm auto;background:#f2ecdf;background-image:radial-gradient(#14141418 1.4px,transparent 1.8px);background-size:9px 9px;padding:22mm 18mm;display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font-family:Pix;font-weight:700;font-size:64px;line-height:1}
.sub{font-family:Cav;font-size:34px;margin-top:10mm;line-height:1.1}
.qr{margin-top:12mm;width:125mm;height:125mm;padding:7mm;background:#fff;border:4px solid #141414;box-shadow:8px 8px 0 #ff4a2b}
.qr svg{width:100%;height:100%;display:block}
.how{margin-top:14mm;font-size:22px;font-weight:700;line-height:1.5}
.how span{color:#ff4a2b}
.url{margin-top:auto;font-size:18px;opacity:.75;word-break:break-all}
.bt{position:fixed;right:20px;top:20px;font:700 18px Sans;padding:12px 20px;border:3px solid #141414;background:#fffaf0;box-shadow:4px 4px 0 #141414;cursor:pointer}
@media print{body{background:none}.a4{margin:0}.bt{display:none}}
</style>
</head>
<body>
<button class="bt" onclick="print()">imprimir</button>
<div class="a4">
 <h1>JANELAS<br>DA FAU</h1>
 <div class="sub">desenhe o que você veria por aqui<br>e mande pra janela da rampa</div>
 <div class="qr" id="qr"></div>
 <div class="how"><span>1</span> escaneie &nbsp; <span>2</span> desenhe &nbsp; <span>3</span> envie<br>cada desenho fica 20 min na parede</div>
 <div class="url" id="url"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const link = location.origin + '/';
document.getElementById('url').textContent = link.replace(/^https?:\/\//, '').replace(/\/$/, '');
const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
</script>
</body>
</html>
